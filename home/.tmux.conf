# Smart pane switching with awareness of Vim splits

set -g mouse on
set -ga terminal-overrides ',*:Ss=\E[4 q:Se=\E[4 q'
setw -g mode-keys vi

# Change tmux prefix from C-b to C-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# press 'y' to 'yank' (copy) in tmux copy mode
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

unbind-key -n C-BSpace

# Exit terminal mode key in Neovim, faster
set -sg escape-time 30

# Smart pane switching
bind-key -n C-h if-shell '[ "#{pane_current_command}" = "vim" ] || [ "#{pane_current_command}" = "nvim" ]' 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell '[ "#{pane_current_command}" = "vim" ] || [ "#{pane_current_command}" = "nvim" ]' 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell '[ "#{pane_current_command}" = "vim" ] || [ "#{pane_current_command}" = "nvim" ]' 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell '[ "#{pane_current_command}" = "vim" ] || [ "#{pane_current_command}" = "nvim" ]' 'send-keys C-l' 'select-pane -R'

# Global: Neovim scrolls normally; other panes enter tmux copy mode and scroll.
bind-key -n C-u if-shell '[ "#{pane_current_command}" = "vim" ] || [ "#{pane_current_command}" = "nvim" ]' 'send-keys C-u' 'copy-mode ; send-keys -X halfpage-up'
bind-key -n C-d if-shell '[ "#{pane_current_command}" = "vim" ] || [ "#{pane_current_command}" = "nvim" ]' 'send-keys C-d' 'copy-mode ; send-keys -X halfpage-down'
bind-key -n C-f if-shell '[ "#{pane_current_command}" = "vim" ] || [ "#{pane_current_command}" = "nvim" ]' 'send-keys C-f' 'copy-mode ; send-keys -X page-down'
bind-key -n C-b if-shell '[ "#{pane_current_command}" = "vim" ] || [ "#{pane_current_command}" = "nvim" ]' 'send-keys C-b' 'copy-mode ; send-keys -X page-up'

# -------------------------------------------------------------------
# Copy mode
# -------------------------------------------------------------------

# Keep pane navigation working in copy mode
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Scrolling while already in copy mode
bind-key -T copy-mode-vi C-u send-keys -X halfpage-up
bind-key -T copy-mode-vi C-d send-keys -X halfpage-down
bind-key -T copy-mode-vi C-f send-keys -X page-down
bind-key -T copy-mode-vi C-b send-keys -X page-up

# Plugin manager and session persistence
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'rose-pine/tmux'

# Rosé Pine theme variant: main, moon, or dawn.
set -g @rose_pine_variant 'moon'

set -g @resurrect-capture-pane-contents 'on'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
run '~/.tmux/plugins/tpm/tpm'
